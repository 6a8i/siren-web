<div id="wizardStartPage" data-role="page" class="page standalonePage wizardPage" data-backbutton="false">
    <div class="wizardShell">
        <div class="wizardMain">
            <div class="wizardCard">
                <form class="wizardStartForm">
                    <div class="wizardHeaderRow">
                        <h1>${WelcomeToProject}</h1>
                        <a is="emby-linkbutton" rel="noopener noreferrer" href="https://jellyfin.org/docs/general/post-install/setup-wizard/" target="_blank" class="button-link wizardHelpLink">
                            <span>${ButtonQuickStartGuide}</span>
                        </a>
                    </div>
                    <p class="wizardIntro">${ThisWizardWillGuideYou}</p>
                    <div class="inputContainer">
                        <input is="emby-input" type="text" id="txtServerName" label="${LabelServerName}" required="required" />
                        <div class="fieldDescription">${LabelServerNameHelp}</div>
                    </div>
                    <div class="selectContainer">
                        <select is="emby-select" id="selectLocalizationLanguage" label="${LabelPreferredDisplayLanguage}"></select>
                    </div>

                    <div class="wizardNavigation">
                        <button is="emby-button" type="submit" class="raised button-submit">
                            <span>${Next}</span>
                            <span class="material-icons arrow_forward" aria-hidden="true"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div id="wizardUserPage" data-role="page" class="page standalonePage wizardPage">
    <div class="wizardShell">
        <div class="wizardMain">
            <div class="wizardCard">
                <form class="wizardUserForm">
                    <div class="verticalSection">
                        <h1 class="sectionTitle">${TellUsAboutYourself}</h1>
                        <p class="wizardIntro">${UserProfilesIntro}</p>
                        <div class="inputContainer">
                            <input is="emby-input" type="text" id="txtUsername" label="${LabelUsername}" required="required" />
                            <div class="fieldDescription">${SelectAdminUsername}</div>
                        </div>
                        <div class="inputContainer">
                            <input is="emby-input" id="txtManualPassword" type="password" label="${LabelPassword}" required="required" />
                            <div class="fieldDescription">${PasswordRequiredForAdmin}</div>
                        </div>
                        <div class="inputContainer">
                            <input is="emby-input" id="txtPasswordConfirm" type="password" label="${LabelPasswordConfirm}" required="required" />
                        </div>
                        <p class="fieldDescription">${MoreUsersCanBeAddedLater}</p>
                    </div>

                    <div class="wizardNavigation">
                        <button is="emby-button" type="button" class="raised button-cancel" onclick="history.back();">
                            <span class="material-icons arrow_back" aria-hidden="true"></span>
                            <span>${Previous}</span>
                        </button>
                        <button is="emby-button" type="submit" class="raised button-submit">
                            <span>${Next}</span>
                            <span class="material-icons arrow_forward" aria-hidden="true"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

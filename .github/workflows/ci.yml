name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build:
    name: Type-check, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Type-check
        run: npx tsc --noEmit

      # The inherited code carries warnings; they are tolerated, errors are not.
      - name: Lint
        run: npx eslint src --max-warnings 1000

      - name: Test
        run: npm test

      - name: Build (production)
        run: npm run build:production

      - name: Check the bundle's ECMAScript level
        run: npm run escheck
